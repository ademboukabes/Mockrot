[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-mockrot"
version = "0.1.3"
description = "Detect rotting mocks by validating call signatures, return types, and zombie fields against real contracts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Adem Boukabes", email = "adamboukabes1@gmail.com" },
]
maintainers = [
    { name = "Adem Boukabes", email = "adamboukabes1@gmail.com" },
]
keywords = [
    "pytest",
    "mock",
    "testing",
    "typing",
    "pydantic",
    "contracts",
    "rot",
    "qa",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7.0",
    "pytest>=8.0.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/ademboukabes/Mockrot"
Documentation = "https://github.com/ademboukabes/Mockrot#readme"
Repository = "https://github.com/ademboukabes/Mockrot.git"
Issues = "https://github.com/ademboukabes/Mockrot/issues"
Changelog = "https://github.com/ademboukabes/Mockrot/blob/main/CHANGELOG.md"

[project.optional-dependencies]
fix = [
    "libcst>=1.1.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.370",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
]

[project.entry-points.pytest11]
mockrot = "mockrot.plugin"

[project.scripts]
mockrot = "mockrot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mockrot"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
    "PT",
    "N",
    "C4",
    "TC",
    "ARG",
    "BLE",
    "ERA",
    "PL",
]
ignore = [
    "PLR0913",  # Too many arguments in function definition
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = [
    "ARG001",   # Unused function argument (fixture injection)
    "ARG002",   # Unused method argument
    "PLR2004",  # Magic value used in comparison
    "PT004",    # Fixture does not return anything
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["src/mockrot"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
