name: Bug Report
description: Create a report to help us reproduce and fix a bug in Mockrot
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check if the issue has already been reported before submitting.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproducible Example
      description: |
        Please provide a short snippet of code or minimal test case reproducing the issue.
      placeholder: |
        def test_example():
            with patch("..."):
                ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: |
        OS version, Python version, pytest version, and pydantic version.
      placeholder: |
        - OS: macOS / Ubuntu / Windows
        - Python: 3.12.2
        - pytest: 8.3.0
        - pydantic: 2.8.2
        - pytest-mockrot: 0.1.0
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
